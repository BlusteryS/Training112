[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "speech112"
version = "0.1.0"
description = "Low-latency full-duplex Russian voice simulator for 112 operator training"
requires-python = ">=3.11,<3.15"
dependencies = [
  "scipy>=1.15,<2",
  "gigaam @ git+https://github.com/salute-developers/GigaAM.git@7447938d791c4f3e643386ee22c33777004293a5",
  "httpx>=0.28.1,<1",
  "numpy>=2.2,<3",
  "num2words==0.5.14",
  "nvidia-cudnn-cu13>=9.24,<10; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "onnxruntime>=1.22,<2",
  "silero-vad>=6.2,<7",
  "soundfile>=0.14,<1",
  "torch>=2.7,<3",
  "pyzmq>=27,<28",
]

[project.scripts]
speech112 = "speech112.service:main"

[tool.hatch.build.targets.wheel]
packages = ["src/speech112"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
  "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"] # The application intentionally contains Russian UI and prompts.
