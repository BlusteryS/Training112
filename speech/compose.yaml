name: training112-speech

services:
  speech:
    image: training112-speech:latest
    build: .
    restart: unless-stopped
    init: true
    gpus: all
    environment:
      SPEECH_BIND: tcp://0.0.0.0:5555
      SPEECH_MAX_SESSIONS: ${SPEECH_MAX_SESSIONS:-1}
      SPEECH_LLM_URL: ${SPEECH_LLM_URL:-http://host.docker.internal:8081/v1}
      SPEECH_CURVE_PUBLIC_KEY: ${SPEECH_NODE_PUBLIC_KEY:-}
      SPEECH_CURVE_SECRET_KEY: ${SPEECH_NODE_SECRET_KEY:-}
      SPEECH_CURVE_CLIENT_KEYS: ${SPEECH_CLIENT_PUBLIC_KEYS:-}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${SPEECH_LISTEN_ADDRESS:-127.0.0.1}:5555:5555"
    volumes:
      - speech_models:/app/.models
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /home/speech:uid=10001,gid=10001,mode=700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  speech_models:
