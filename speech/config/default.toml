caller_age = 18
reference_audio = "assets/voices/oleg.ogg"
reference_start_seconds = 0.0
reference_end_seconds = 11.65
reference_text = "Сегодня утром я вышел из дома чуть раньше обычного и заметил, как свежий ветер качает ветви деревьев, а яркое солнце медленно появляется над крышами."

[voices.egor]
