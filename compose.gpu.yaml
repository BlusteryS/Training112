services:
  reply-generator:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b10991
    restart: unless-stopped
    command:
      - --model
      - /models/Qwen_Qwen3-4B-Instruct-2507-Q8_0.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "2048"
      - --parallel
      - "1"
      - --n-gpu-layers
      - "99"
    volumes:
      - ./speech/.models/generator:/models:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  worker:
    depends_on:
      reply-generator:
        condition: service_started
