name: training112

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: training112
      POSTGRES_USER: training112
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    shm_size: 256mb
    logging: *logging

  speech:
    build:
      context: .
      dockerfile: speech/Dockerfile
    image: training112-speech:local
    restart: unless-stopped
    command: [speech112]
    environment:
      SPEECH_BIND: tcp://127.0.0.1:5555
      SPEECH_CONFIG: /app/config/default.toml
      HF_HUB_OFFLINE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - speech_audio:/app/.cache/audio
    healthcheck:
      test: [CMD, python, -c, 'import socket;s=socket.socket();s.settimeout(1);s.connect(("127.0.0.1",5555))']
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s
    logging: *logging

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    network_mode: service:speech
    environment:
      PORT: "8080"
      BIND_HOST: 0.0.0.0
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: training112
      DB_USER: training112
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      APP_ORIGIN: https://${SERVER_IP:?Run deploy/setup.py first}
      TLS_TERMINATED_BY_PROXY: "true"
      SPEECH_ENDPOINT: tcp://127.0.0.1:5555
    depends_on:
      db:
        condition: service_healthy
      speech:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/api/health/ready]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging

  worker:
    image: training112-speech:local
    restart: unless-stopped
    command: [training112-worker]
    environment:
      TRAINING_DATABASE_URL: ""
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: training112
      PGUSER: training112
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SPEECH_CONFIG: /app/config/default.toml
      HF_HUB_OFFLINE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - speech_audio:/app/.cache/audio
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    logging: *logging

  web:
    build:
      context: .
      dockerfile: site/Dockerfile
    restart: unless-stopped
    ports:
      - "${SERVER_IP:?Run deploy/setup.py first}:443:8443"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./deploy/tls/server.crt:/etc/nginx/tls/server.crt:ro
      - ./deploy/tls/server.key:/etc/nginx/tls/server.key:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 3s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging

volumes:
  postgres_data:
  speech_audio:
